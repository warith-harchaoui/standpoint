<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1633 432" width="1633" height="432" role="img" aria-labelledby="sp-title sp-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="sp-title">Comment standpoint fonctionne : un tableau comparatif en entrée, une carte de positionnement dont chaque coordonnée est vérifiable en sortie</title>
  <desc id="sp-desc">Une plaque de gauche à droite. Entrée : un tableau comparatif — les options en lignes, les critères en colonnes, des nombres dans les cases. Le travail, en trois étapes numérotées : le tableau est lu puis les notes normalisées, pour que des critères mesurés sur des échelles différentes se combinent ; une analyse en composantes principales garde deux composantes, dont les axes restent des sommes pondérées lisibles de vos colonnes ; la carte est dessinée, chaque option placée à sa coordonnée calculée avec des étiquettes disposées sans se chevaucher. Sortie : une carte en deux dimensions, plus un fichier YAML donnant chaque coordonnée.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="269" height="78" rx="10"/>
  <text class="n-title" x="163" y="120" text-anchor="middle">un tableau comparatif</text>
  <text class="n-sub" x="163" y="139" text-anchor="middle">options × critères, nombres en cases</text>
  <path class="flow" d="M303 126 H319" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="323" y="54" width="989" height="144" rx="12"/>
  <text class="panel-label" x="343" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="343" y="94" width="338" height="78" rx="10"/>
  <text class="n-title" x="513" y="127" text-anchor="middle">standardiser</text>
  <text class="n-sub" x="513" y="146" text-anchor="middle">moyenne 0, écart-type 1 — l'ACP y est sensible</text>
  <text class="step" x="354" y="110">1</text>
  <path class="flow" d="M686 133 H702" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="708" y="94" width="224" height="78" rx="10"/>
  <text class="n-title" x="820" y="127" text-anchor="middle">ACP, deux composantes</text>
  <text class="n-sub" x="820" y="146" text-anchor="middle">des axes qui restent lisibles</text>
  <text class="step" x="719" y="110">2</text>
  <path class="flow" d="M936 133 H952" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="958" y="94" width="335" height="78" rx="10"/>
  <text class="n-title" x="1125" y="127" text-anchor="middle">pivoter + étiqueter</text>
  <text class="n-sub" x="1125" y="146" text-anchor="middle">référence en haut à droite, sans chevauchement</text>
  <text class="step" x="969" y="110">3</text>
  <path class="flow" d="M1318 126 H1334" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1338" y="40">SORTIE</text>
  <rect class="io" x="1338" y="87" width="267" height="78" rx="10"/>
  <text class="n-title" x="1472" y="120" text-anchor="middle">une carte + les coordonnées</text>
  <text class="n-sub" x="1472" y="139" text-anchor="middle">SVG plus un YAML vérifiable</text>
  <rect class="core" x="607" y="232" width="420" height="54" rx="10"/>
  <text class="on-dark" x="817" y="253" text-anchor="middle">une bibliothèque, appelée pareil partout</text>
  <text class="on-dark-sub" x="817" y="272" text-anchor="middle">os-helper dessous pour la journalisation et les fichiers</text>
  <path class="tie" d="M817 286 V314 H553 V332"/>
  <path class="tie" d="M817 314 H1081 V332"/>
  <path class="tie" d="M553 314 V332"/>
  <rect class="surface" x="478" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="553" y="360" text-anchor="middle">API Python</text>
  <path class="tie" d="M729 314 V332"/>
  <rect class="surface" x="654" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="729" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M905 314 V332"/>
  <rect class="surface" x="830" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="905" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M1081 314 V332"/>
  <rect class="surface" x="1006" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="1081" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="817" y="412" text-anchor="middle">La position de chaque point est calculée depuis votre tableau puis écrite en YAML : on peut vérifier le placement au lieu de le croire.</text>
</svg>
