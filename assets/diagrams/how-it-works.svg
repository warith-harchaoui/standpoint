<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 432" width="1490" height="432" role="img" aria-labelledby="sp-title sp-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="sp-title">How standpoint works: a comparison table in, a positioning map whose every coordinate can be audited out</title>
  <desc id="sp-desc">A left-to-right plate. In: one comparison table — options in the rows, criteria in the columns, numbers in the cells. The work, in three numbered stages: the table is read and the ratings normalised so criteria measured on different scales can be combined; a principal component analysis keeps two components, whose axes stay readable weighted sums of your original columns; and the map is drawn, each option placed at its computed coordinate with the labels laid out so they do not collide. Out: a labelled two-dimensional map, and a YAML file giving every coordinate. The caption is the point of the whole package: the placement is computed and checkable, not drawn by hand.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="269" height="78" rx="10"/>
  <text class="n-title" x="163" y="120" text-anchor="middle">a comparison table</text>
  <text class="n-sub" x="163" y="139" text-anchor="middle">options × criteria, numbers in cells</text>
  <path class="flow" d="M303 126 H319" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="323" y="54" width="871" height="144" rx="12"/>
  <text class="panel-label" x="343" y="76">WHAT IT DOES</text>
  <rect class="stage" x="343" y="94" width="280" height="78" rx="10"/>
  <text class="n-title" x="483" y="127" text-anchor="middle">standardise</text>
  <text class="n-sub" x="483" y="146" text-anchor="middle">mean 0, sd 1 — PCA is scale-sensitive</text>
  <text class="step" x="354" y="110">1</text>
  <path class="flow" d="M627 133 H643" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="649" y="94" width="243" height="78" rx="10"/>
  <text class="n-title" x="771" y="127" text-anchor="middle">PCA, two components</text>
  <text class="n-sub" x="771" y="146" text-anchor="middle">axes stay readable weighted sums</text>
  <text class="step" x="660" y="110">2</text>
  <path class="flow" d="M896 133 H912" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="918" y="94" width="256" height="78" rx="10"/>
  <text class="n-title" x="1046" y="127" text-anchor="middle">rotate + label</text>
  <text class="n-sub" x="1046" y="146" text-anchor="middle">reference top right, no collisions</text>
  <text class="step" x="929" y="110">3</text>
  <path class="flow" d="M1201 126 H1217" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1221" y="40">OUT</text>
  <rect class="io" x="1221" y="87" width="241" height="78" rx="10"/>
  <text class="n-title" x="1341" y="120" text-anchor="middle">a map + every coordinate</text>
  <text class="n-sub" x="1341" y="139" text-anchor="middle">SVG plus a YAML you can check</text>
  <rect class="core" x="529" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="745" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="745" y="272" text-anchor="middle">os-helper underneath for logging and file management</text>
  <path class="tie" d="M745 286 V314 H481 V332"/>
  <path class="tie" d="M745 314 H1009 V332"/>
  <path class="tie" d="M481 314 V332"/>
  <rect class="surface" x="406" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="481" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M657 314 V332"/>
  <rect class="surface" x="582" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="657" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M833 314 V332"/>
  <rect class="surface" x="758" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="833" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M1009 314 V332"/>
  <rect class="surface" x="934" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="1009" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="745" y="412" text-anchor="middle">Every dot's position is computed from your table and written out as YAML, so a reader can check the placement instead of trusting it.</text>
</svg>
