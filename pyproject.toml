[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "standpoint"
description = "Know where each option stands: a labelled 2D positioning map from any comparison table."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Warith Harchaoui" }]
keywords = ["pca", "positioning map", "perceptual map", "quadrant", "svg"]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "resvg-py>=0.3",
    "PyYAML>=6.0",
    "langdetect>=1.0.9",
    "best-engine-ai-helper>=1.0",
    "click>=8.1",
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
# Testing + linting kept light so CI installs fast. `httpx` backs Starlette's
# TestClient, so the model-free GUI/API endpoint tests run in CI (with the gui extra).
# `ollama` is not a library dependency (LLM calls route through best-engine-ai-helper,
# see the [0.7.0] CHANGELOG entry) -- it is here only for tests/conftest.py, which
# calls the Ollama client directly to confirm/pull the model before @needs_model tests.
dev = ["pytest>=7.0", "ruff>=0.5", "httpx>=0.27", "ollama>=0.3"]
# `deepeval` powers the optional pole-naming evaluation in tests/test_eval.py. It is
# a separate, heavier extra: the eval is skipped unless both deepeval and a local
# Ollama model are available, so it runs on a workstation, not in the default CI job.
eval = ["deepeval>=1.0"]
# `gui` is the browser app + its FastAPI backend (standpoint.api + standpoint.webgui).
# The core library and CLIs never import it. python-multipart handles file uploads,
# openpyxl the CSV<->XLSX conversions.
gui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "openpyxl>=3.1"]
# `mcp` exposes the same FastAPI app as MCP tools (standpoint.mcp); it needs the gui
# backend plus fastapi-mcp. `mcp` (the underlying SDK) is capped below 2: fastapi-mcp
# 0.4.0 calls Server(name, description) positionally, which mcp>=2.0.0 broke by
# dropping the second positional arg. Recheck this cap when fastapi-mcp catches up.
mcp = ["standpoint[gui]", "fastapi-mcp>=0.3,<1", "mcp<2"]

[project.urls]
Homepage = "https://github.com/warith-harchaoui/standpoint"
Author = "https://www.linkedin.com/in/warith-harchaoui"

[project.scripts]
standpoint = "standpoint:main"
standpoint-click = "standpoint.click_cli:main"
standpoint-gui = "standpoint.api:main_gui"
standpoint-mcp = "standpoint.mcp:main"

[tool.setuptools]
packages = ["standpoint"]

[tool.setuptools.dynamic]
version = { attr = "standpoint.__version__" }

[tool.setuptools.package-data]
standpoint = ["llm.brief.yaml", "locales/*.yaml", "static/*"]

[tool.ruff]
# One source of truth for lint + format (Rule 17). 100 cols matches the prose-heavy
# docstrings; target the oldest supported interpreter so no newer syntax slips in.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Conservative, high-signal set: pyflakes (F), pycodestyle errors/warnings (E/W),
# isort (I), bugbear (B), comprehensions (C4), pyupgrade (UP), simplify (SIM).
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "SIM108", # ternary-over-if/else sometimes hurts readability
    "B008",   # call in arg default is the idiomatic FastAPI pattern (File/Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # `assert False` is idiomatic in pytest
