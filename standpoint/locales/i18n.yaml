# Standpoint: localized LLM prompt templates.
# Language is auto-detected from the table's column names (langdetect); the
# detected language drives the pole names so the whole deliverable comes out in
# the table's own language. Supported: en, fr, es.
#
# Placeholders (Python str.format): {glossary} {left} {right} {bottom} {top}
# for axis_prompt. JSON braces are escaped as {{ }}.

en:
  # Figure title. {plural} is the plural of the table's first-column noun. The whole
  # title is localized, so a French table never reads "Voitures in the Quadrant".
  title_template: "{plural} in the Quadrant"
  noun_prompt: |
    Translate this word to English if it isn't already, then give its singular and
    plural forms, capitalized, not a different synonym: "{word}".
    Reply as JSON: {{"singular": "...", "plural": "..."}}.
  glossary_prefix: "Glossary, translate these to plain words, never output the acronym: "
  axis_prompt: |
    You are naming the four poles of a 2D map whose two axes are weighted
    combinations of the input criteria. Every criterion is rated higher-is-better:
    a higher value always means more of a good thing.

    Each label names a POSITIVE QUALITY, a strength an approach at that end can be
    praised for. Give a concise label of ONE to THREE real English words. Rules:
    - ALWAYS a positive quality. NEVER a drawback, cost, or negative. Forbidden
      examples: 'High Cost', 'Expensive', 'Slow', 'Complex', 'Insecure'. If a
      criterion is an inverse quantity (cost, price, latency, errors) where a high
      rating means LESS of it, name the benefit instead ('Affordable', 'Fast',
      'Reliable', 'Simple', 'Secure').
    - The four labels are four DIFFERENT positive qualities, never an opposite pair
      or antonyms (not 'Affordable' and 'Expensive', not 'Fast' and 'Slow'), and
      never reuse a word across labels.
    - Never output an acronym or abbreviation; spell out the idea.
    - Write the labels in English.

    Each pole below lists the criteria that approaches THERE score highest on. Name
    the shared positive quality of that list:
    {glossary}LEFT pole, strongest at: {left}
    RIGHT pole, strongest at: {right}
    BOTTOM pole, strongest at: {bottom}
    TOP pole, strongest at: {top}

    Reply as JSON: {{"left": "<label>", "right": "<label>", "bottom": "<label>", "top": "<label>"}}.
  # "Flemme" (lazy) autofill: the user typed the option names and the criteria; the
  # model fills every rating from its own knowledge. {noun} is the first-column word.
  analysis_md:
    dir_left: "left"
    dir_right: "right"
    dir_top: "top"
    dir_bottom: "bottom"
    axes_heading: "Axes"
    analysis_heading: "Analysis"
    imputed_heading: "Cells the table did not contain"
    horizontal: "Horizontal"
    vertical: "Vertical"
    variance_axis: "~{pct}% of the variance"
    variance_total: "In two axes, we preserved ~{pct}% of the information in the table."
    imputed_intro: "These ratings were not supplied and were filled with their column's minimum, so every coordinate above depends partly on them:"
    unavailable: "The written analysis needs the local model, which was not reachable."
  analysis_prompt: |
    You are writing the short written analysis that accompanies a 2D
    positioning map. The map is a PCA of a comparison table: every criterion is
    rated 1 to 5, higher is better, and the two axes are weighted combinations
    of those criteria.

    Write TWO or THREE short paragraphs of plain English prose. Rules:
    - Interpret, do not recite. The reader already has the table and the
      numbers; what they want is what the shape MEANS.
    - Never state a percentage, a coordinate or a rating. Those are computed
      and printed around your text, and a number you invent would contradict
      them.
    - Say what the horizontal axis separates, and what the vertical one
      separates. Name the criteria that load most heavily on each.
    - Name which options sit together and why, including any that land in the
      same corner for different reasons.
    - If the leader wins on some axes and not others, say so plainly. A
      analysis that only flatters the leader is worthless.
    - Never say two options sit together, converge, or share a corner unless
      the quadrant list below gives them the SAME label. A model that groups
      two options by intuition writes a sentence the map contradicts.
    - No headings, no bullet lists, no bold. Flowing prose only.
    - Write in English.

    Reference option (the leader): {reference}

    Horizontal axis: {axis_1}, from {pole_left} on the left to {pole_right} on the right.
    Weights on the horizontal axis: {loadings_1}
    Toward {pole_right} (the right side), strongest first: {right_side}
    Toward {pole_left} (the left side), strongest first: {left_side}

    Vertical axis: {axis_2}, from {pole_bottom} at the bottom to {pole_top} at the top.
    Weights on the vertical axis: {loadings_2}
    Toward {pole_top} (the upper half), strongest first: {top_side}
    Toward {pole_bottom} (the lower half), strongest first: {bottom_side}

    Each option's quadrant, already worked out for you -- use these words and do
    not try to re-derive a position: {quadrants}
  ratings_prompt: |
    You rate options on criteria for a comparison table, using your own knowledge.
    The options ({noun}) are: {options}.
    The criteria are: {criteria}.
    Rate EVERY option on EVERY criterion with an INTEGER from 1 to 5, where 5 is the
    best possible and 1 the worst, judging each criterion on its plain positive
    meaning (for a cost/price/latency criterion, 5 means cheap/fast, 1 means
    expensive/slow). Base the ratings on what these options are actually known for.
    Reply as JSON only, an object mapping each exact option name to an object mapping
    each exact criterion name to its integer, e.g.
    {{"OptionA": {{"Crit1": 4, "Crit2": 2}}, "OptionB": {{"Crit1": 3, "Crit2": 5}}}}.
  vlm_assess_prompt: >-
    This image is a 2D competitor positioning map. The single RED dot is the
    leader and should sit in the TOP-RIGHT QUADRANT (anywhere in the
    upper-right quarter of the map, above the horizontal axis and right of the
    vertical axis; it does NOT need to touch the extreme corner). The four
    axis poles are named in italic text at the top, bottom, left, and right
    edges. Assess three things: (1) is the red leader dot anywhere in the
    top-right quadrant? (2) are the point labels readable and not badly
    overlapping? (3) are the four italic axis pole labels at the edges present
    and legible? Reply as JSON.
  # Notes for the deterministic layout self-check (`assess_layout`), which
  # replaced the vision model on the CLI's --check path.
  check_ok: "Layout checks passed."
  check_leader_not_top_right: "The leader ({leader}) is not in the top-right quadrant."
  check_poles_missing: "Some axis pole labels are missing."
  check_crowded: "Point labels risk overlapping: {pairs}."
  gui:
    lang_name: English
    baseline: Where do you stand?
    pitch: Give any table of options scored against criteria and it will place each one on a quadrant, with axes derived from your data and labeled in plain language, so you can see at a glance where the option you care about stands.
    guide_1: Fill out the table (or import it as a CSV/XLSX file), then select the row you want to promote.
    guide_2: Click “Generate Quadrant”.
    github: ⭐️ on GitHub
    busy_aria: Working…
    theme_light_aria: Switch to dark theme
    theme_dark_aria: Switch to light theme
    lang_aria: Switch language
    table_title: Table
    examples_label: "Examples:"
    ex_languages: Programming languages
    ex_laptops: Laptops
    ex_cloud: Cloud providers
    ex_cars: Electric cars
    add_row: ＋ Option (row)
    add_col: ＋ Criterion (column)
    new_table: 🆕 New Table
    flemme: 😴 Laziness (auto-fill)
    flemme_aria: Auto-fill the empty cells from the model's knowledge
    upload: Upload CSV / XLSX
    download_csv: Download CSV
    download_xlsx: Download XLSX
    hint_higher: Higher is better by default.
    hint_toggle: "Toggle ⬇️ / ⬆️ on a column to set whether lower or higher is the better score."
    options_title: Options
    reference_label: Chosen top-right reference
    transparent_bg: Transparent background
    generate: Generate quadrant
    generating: Generating…
    status_running: "Running PCA and asking the local model… (this can take ~10–25 s)"
    flemme_running: "Asking the model to fill the table… (this can take a moment)"
    quadrant_title: Quadrant
    chart_placeholder: Generate to see the map.
    err_upload: "Upload failed: "
    err_xlsx: XLSX export failed.
    err_flemme: "Auto-fill failed: "
    err_generic: "Error: "
    err_image: "Image export failed: "
    # Static (in-browser) build only: ONE distilled model, downloaded at page
    # load, answers every engine call — pole naming, noun forms, the
    # "Laziness" ratings fill (webapp/backend-pyodide.js).
    # The server GUI never shows these keys.
    flemme_none: "no empty cells to fill — add an option, a criterion, or clear a cell first."
    model_loading: "Downloading the AI model (about 330 MB, once — it stays cached for later visits)… "
    model_offline: "AI model unavailable; axes and names fall back to the built-in heuristics."
    flemme_server: "Answered by the shared AI server. Your table's data was sent to it, not kept in this page."
    flemme_server_login: "Sign in to the shared AI server for the fast path. Using the in-page model meanwhile."
    flemme_server_login_link: "Sign in"
    flemme_nogpu: "this browser can't run the in-page AI model (WebGPU missing); try a recent Chrome, Edge or Safari."
    new_option: New
    new_criterion: Criterion
    aria_options_col: Name of the options column
    aria_criterion: Criterion {n} name
    aria_higher: Higher is better, click to make lower better
    aria_lower: Lower is better, click to make higher better
    title_higher: higher is better (click to flip)
    title_lower: lower is better (click to flip)
    aria_del_col: Delete column
    title_del_col: delete column
    aria_del_row: Delete option {n}
    title_del_row: delete row
    aria_option: Option {n} name
    aria_rating: Rating of {opt} on {crit}
    ref_fallback: "row {i}"
    poles_title: Axis poles
    poles_hint: "Rename the four poles; the map updates live."
    aria_pole_top: Top pole name
    aria_pole_left: Left pole name
    aria_pole_right: Right pole name
    aria_pole_bottom: Bottom pole name

fr:
  # « Voitures dans le quadrant », jamais « Voitures in the Quadrant ».
  title_template: "{plural} dans le quadrant"
  noun_prompt: |
    Traduisez ce mot en français s'il ne l'est pas déjà, puis donnez son singulier et
    son pluriel, avec une majuscule, pas un synonyme différent : « {word} ».
    Répondez en JSON : {{"singular": "...", "plural": "..."}}.
  glossary_prefix: "Glossaire, traduisez en mots simples, n'affichez jamais l'acronyme : "
  axis_prompt: |
    Vous nommez les quatre pôles d'une carte 2D dont les deux axes sont des
    combinaisons pondérées des critères d'entrée. Chaque critère est noté « plus
    c'est haut, mieux c'est » : une valeur plus élevée signifie toujours plus d'une
    bonne chose.

    Chaque étiquette nomme une QUALITÉ POSITIVE, une force pour laquelle une
    approche de ce côté peut être louée. Donnez une étiquette de UN à TROIS vrais
    mots français. Règles :
    - TOUJOURS une qualité positive. JAMAIS un inconvénient, un coût ni un négatif.
      Exemples interdits : « Coût élevé », « Cher », « Lent », « Complexe ». Si un
      critère est une quantité inverse (coût, prix, latence, erreurs) où une note
      élevée signifie MOINS, nommez plutôt le bénéfice (« Abordable », « Rapide »,
      « Fiable », « Simple », « Sécurisé »).
    - Les quatre étiquettes sont quatre qualités positives DIFFÉRENTES, jamais une
      paire opposée ni des antonymes (pas « Abordable » et « Cher », pas « Rapide »
      et « Lent »), et ne réutilisez jamais un mot d'une étiquette à l'autre.
    - N'affichez jamais d'acronyme ni d'abréviation ; explicitez l'idée.
    - Rédigez les étiquettes en français.

    Chaque pôle ci-dessous liste les critères où les approches obtiennent les
    meilleures notes. Nommez la qualité positive commune de cette liste :
    {glossary}Pôle GAUCHE, les plus fortes en : {left}
    Pôle DROIT, les plus fortes en : {right}
    Pôle BAS, les plus fortes en : {bottom}
    Pôle HAUT, les plus fortes en : {top}

    Répondez en JSON : {{"left": "<label>", "right": "<label>", "bottom": "<label>", "top": "<label>"}}.
  # « Flemme » : l'utilisateur a saisi les noms des options et des critères ; le
  # modèle remplit chaque note depuis sa propre connaissance. {noun} = mot d'en-tête.
  analysis_md:
    dir_left: "gauche"
    dir_right: "droite"
    dir_top: "haut"
    dir_bottom: "bas"
    axes_heading: "Axes"
    analysis_heading: "Analyse"
    imputed_heading: "Cases que le tableau ne contenait pas"
    horizontal: "Horizontal"
    vertical: "Vertical"
    variance_axis: "~{pct} % de la variance"
    variance_total: "En deux axes, nous avons préservé ~{pct} % de l'information du tableau."
    imputed_intro: "Ces notes n'étaient pas fournies ; elles ont été remplies par le minimum de leur colonne, si bien que chaque coordonnée ci-dessus en dépend en partie :"
    unavailable: "L'analyse écrite demande le modèle local, qui n'était pas joignable."
  analysis_prompt: |
    Vous rédigez la courte analyse écrite qui accompagne une carte de
    positionnement en 2D. La carte est une ACP d'un tableau comparatif : chaque
    critère est noté de 1 à 5, le plus haut étant le mieux, et les deux axes
    sont des combinaisons pondérées de ces critères.

    Écrivez DEUX ou TROIS courts paragraphes en français courant. Règles :
    - Interprétez, ne récitez pas. Le lecteur a déjà le tableau ainsi que les
      chiffres ; ce qu'il veut, c'est ce que la forme VEUT DIRE.
    - N'énoncez jamais un pourcentage, une coordonnée ni une note. Ces valeurs
      sont calculées puis imprimées autour de votre texte, et un chiffre que
      vous inventeriez les contredirait.
    - Dites ce que sépare l'axe horizontal, puis ce que sépare l'axe vertical.
      Nommez les critères qui pèsent le plus sur chacun.
    - Nommez les options qui se regroupent ainsi que la raison, y compris
      celles qui atterrissent dans le même coin pour des raisons différentes.
    - Si le leader gagne sur certains axes et pas sur d'autres, dites-le
      franchement. Une analyse qui ne fait que flatter le leader ne vaut rien.
    - Ne dites jamais que deux options se rejoignent, convergent ou partagent
      un coin si la liste des quadrants ci-dessous ne leur donne pas la MÊME
      étiquette. Regrouper deux options à l'intuition produit une phrase que la
      carte contredit.
    - Aucun titre, aucune liste à puces, aucun gras. Prose suivie uniquement.
    - N'écrivez jamais une virgule avant « et » ni avant « ou ».
    - Rédigez en français.

    Option de référence (le leader) : {reference}

    Axe horizontal : {axis_1}, de {pole_left} à gauche vers {pole_right} à droite.
    Poids sur l'axe horizontal : {loadings_1}
    Vers {pole_right} (le côté droit), du plus fort au plus faible : {right_side}
    Vers {pole_left} (le côté gauche), du plus fort au plus faible : {left_side}

    Axe vertical : {axis_2}, de {pole_bottom} en bas vers {pole_top} en haut.
    Poids sur l'axe vertical : {loadings_2}
    Vers {pole_top} (la moitié haute), du plus fort au plus faible : {top_side}
    Vers {pole_bottom} (la moitié basse), du plus fort au plus faible : {bottom_side}

    Le quadrant de chaque option, déjà établi pour vous — reprenez ces mots sans
    tenter de recalculer une position : {quadrants}
  ratings_prompt: |
    Vous notez des options sur des critères pour un tableau comparatif, à partir de
    votre propre connaissance.
    Les options ({noun}) sont : {options}.
    Les critères sont : {criteria}.
    Notez CHAQUE option sur CHAQUE critère avec un ENTIER de 1 à 5, où 5 est le
    meilleur possible et 1 le pire, en jugeant chaque critère sur son sens positif
    simple (pour un critère de coût/prix/latence, 5 = bon marché/rapide, 1 =
    cher/lent). Fondez les notes sur ce pour quoi ces options sont réellement connues.
    Répondez uniquement en JSON, un objet associant chaque nom exact d'option à un
    objet associant chaque nom exact de critère à son entier, p. ex.
    {{"OptionA": {{"Crit1": 4, "Crit2": 2}}, "OptionB": {{"Crit1": 3, "Crit2": 5}}}}.
  vlm_assess_prompt: >-
    Cette image est une carte de positionnement concurrentiel en 2D. Le point
    ROUGE unique est le leader et devrait se situer dans le QUADRANT
    HAUT-DROIT (n'importe où dans le quart supérieur droit de la carte,
    au-dessus de l'axe horizontal et à droite de l'axe vertical ; il n'a PAS
    besoin de toucher le coin extrême). Les quatre pôles d'axe sont nommés en
    italique aux bords haut, bas, gauche et droit. Évaluez trois choses :
    (1) le point rouge du leader est-il quelque part dans le quadrant haut-droit ?
    (2) les étiquettes des points sont-elles lisibles et ne se chevauchent-elles
    pas trop ? (3) les quatre étiquettes de pôle en italique sont-elles
    présentes et lisibles aux bords ? Répondez en JSON.
  # Notes de la vérification de mise en page déterministe (`assess_layout`),
  # qui a remplacé le modèle de vision sur le chemin --check de la CLI.
  check_ok: "Vérifications de mise en page réussies."
  check_leader_not_top_right: "Le leader ({leader}) n'est pas dans le quadrant haut-droit."
  check_poles_missing: "Des étiquettes de pôle d'axe sont manquantes."
  check_crowded: "Les étiquettes de points risquent de se chevaucher : {pairs}."
  gui:
    lang_name: Français
    baseline: Sachez où vous en êtes
    pitch: "Partez de n'importe quel tableau d'options notées selon des critères : chacune est placée sur un quadrant dont les axes sont déduits de vos données et nommés en langage clair, pour voir d'un coup d'œil où se situe l'option qui vous intéresse."
    guide_1: Remplir le tableau (ou l'importer en CSV/XLSX) puis choisir la ligne à promouvoir.
    guide_2: Cliquer sur « Générer le quadrant ».
    github: ⭐️ sur GitHub
    busy_aria: Traitement en cours…
    theme_light_aria: Passer au thème sombre
    theme_dark_aria: Passer au thème clair
    lang_aria: Changer de langue
    table_title: Tableau
    examples_label: "Exemples :"
    ex_languages: Langages de programmation
    ex_laptops: Ordinateurs portables
    ex_cloud: Fournisseurs cloud
    ex_cars: Voitures électriques
    add_row: ＋ Option (ligne)
    add_col: ＋ Critère (colonne)
    new_table: 🆕 Nouveau tableau
    flemme: 😴 Paresse (auto-remplissage)
    flemme_aria: Remplir les cellules vides depuis la connaissance du modèle
    upload: Importer CSV / XLSX
