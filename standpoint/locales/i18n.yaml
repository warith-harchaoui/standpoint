    flemme_none: "aucune cellule vide à remplir — ajoutez une option, un critère, ou videz une cellule d'abord."
    model_loading: "Téléchargement du modèle IA (environ 330 Mo, une seule fois — il reste en cache pour les prochaines visites)… "
