# Standpoint: localized LLM prompt templates.
# Language is auto-detected from the table's column names (langdetect); the
# detected language drives the pole names and the written analysis so the whole
# deliverable comes out in the table's own language. Supported: en, fr, es.
#
# Placeholders (Python str.format): {glossary} {left} {right} {bottom} {top}
# for axis_prompt; {left} {right} {bottom} {top} {reference} {best} {worst}
# {champ_top} {champ_right} {leaderboard} for narrative_prompt ({champ_top} /
# {champ_right} are the challengers that reach furthest toward the top / right
# poles). JSON braces are escaped as {{ }}.

en:
  # Figure title. {plural} is the plural of the table's first-column noun. The whole
  # title is localized, so a French table never reads "Voitures in the Quadrant".
  title_template: "{plural} in the Quadrant"
  noun_prompt: |
    Give the singular and plural of EXACTLY this word, in English, capitalized, without
    replacing it by a synonym: "{word}".
    Reply as JSON: {{"singular": "...", "plural": "..."}}.
  glossary_prefix: "Glossary, translate these to plain words, never output the acronym: "
  axis_prompt: |
    You are naming the four poles of a 2D map whose two axes are weighted
    combinations of the input criteria. Every criterion is rated higher-is-better:
    a higher value always means more of a good thing.

    Each label names a POSITIVE QUALITY, a strength an approach at that end can be
    praised for. Give a concise label of ONE to THREE real English words. Rules:
    - ALWAYS a positive quality. NEVER a drawback, cost, or negative. Forbidden
      examples: 'High Cost', 'Expensive', 'Slow', 'Complex', 'Insecure'. If a
      criterion is an inverse quantity (cost, price, latency, errors) where a high
      rating means LESS of it, name the benefit instead ('Affordable', 'Fast',
      'Reliable', 'Simple', 'Secure').
    - The four labels are four DIFFERENT positive qualities, never an opposite pair
      or antonyms (not 'Affordable' and 'Expensive', not 'Fast' and 'Slow'), and
      never reuse a word across labels.
    - Never output an acronym or abbreviation; spell out the idea.
    - Write the labels in English.

    Each pole below lists the criteria that approaches THERE score highest on. Name
    the shared positive quality of that list:
    {glossary}LEFT pole, strongest at: {left}
    RIGHT pole, strongest at: {right}
    BOTTOM pole, strongest at: {bottom}
    TOP pole, strongest at: {top}

    Reply as JSON: {{"left": "<label>", "right": "<label>", "bottom": "<label>", "top": "<label>"}}.
  narrative_prompt: |
    You are a sharp analyst writing the takeaways from a positioning map, in English.
    Write 4-6 sentences of concrete, decision-useful insight, NOT a restatement of
    the axes. The horizontal axis runs from '{left}' to '{right}'; the vertical from
    '{bottom}' to '{top}'. '{reference}' is the reference leader (top-right).
    Best={best}, worst={worst}; the standout toward '{top}' is {champ_top} and toward
    '{right}' is {champ_right}. Overall order, strongest first: {leaderboard}.
    Cover, in flowing prose: (1) the single biggest takeaway a reader should leave
    with; (2) what '{reference}' actually wins on and where it is exposed;
    (3) the sharpest trade-off in the field and which option fits which need;
    (4) any option that punches above or below its rank. Name real options, be
    specific and genuinely useful, never generic. No acronyms, no bullet lists.
    Write plain prose with no dash punctuation: use commas, colons, semicolons, or
    separate sentences instead of em dashes or en dashes.
  # "Flemme" (lazy) autofill: the user typed the option names and the criteria; the
  # model fills every rating from its own knowledge. {noun} is the first-column word.
  ratings_prompt: |
    You rate options on criteria for a comparison table, using your own knowledge.
    The options ({noun}) are: {options}.
    The criteria are: {criteria}.
    Rate EVERY option on EVERY criterion with an INTEGER from 1 to 5, where 5 is the
    best possible and 1 the worst, judging each criterion on its plain positive
    meaning (for a cost/price/latency criterion, 5 means cheap/fast, 1 means
    expensive/slow). Base the ratings on what these options are actually known for.
    Reply as JSON only, an object mapping each exact option name to an object mapping
    each exact criterion name to its integer, e.g.
    {{"OptionA": {{"Crit1": 4, "Crit2": 2}}, "OptionB": {{"Crit1": 3, "Crit2": 5}}}}.
  gui:
    lang_name: English
    baseline: Know where each option actually stands.
    github: ⭐️ on GitHub
    footer_note: "Local-first: your table never leaves this machine."
    theme_light_aria: Switch to dark theme
    theme_dark_aria: Switch to light theme
    lang_aria: Switch language
    table_title: Table
    add_row: ＋ Option (row)
    add_col: ＋ Criterion (column)
    new_table: 🆕 New Table
    flemme: 😴 Laziness (auto-fill)
    flemme_aria: Auto-fill the empty cells from the model's knowledge
    upload: Upload CSV / XLSX
    download_csv: Download CSV
    download_xlsx: Download XLSX
    hint_higher: Higher is better by default.
    hint_toggle: "Toggle ⬇️ / ⬆️ on a column to set whether lower or higher is the better score."
    options_title: Options
    reference_label: Chosen top-right reference
    transparent_bg: Transparent background
    generate: Generate quadrant
    generating: Generating…
    status_running: "Running PCA and asking the local model… (this can take ~10–25 s)"
    flemme_running: "Asking the model to fill the table… (this can take a moment)"
    quadrant_title: Quadrant
    chart_placeholder: Generate to see the map.
    analysis_title: Basic Analysis
    download_md: Download Markdown
    analysis_placeholder: The written interpretation appears here once you generate.
    err_upload: "Upload failed: "
    err_xlsx: XLSX export failed.
    err_flemme: "Auto-fill failed: "
    err_generic: "Error: "
    err_image: "Image export failed: "
    no_analysis: "*(no analysis, enable the model)*"
    new_option: New
    new_criterion: Criterion
    aria_options_col: Name of the options column
    aria_criterion: Criterion {n} name
    aria_higher: Higher is better, click to make lower better
    aria_lower: Lower is better, click to make higher better
    title_higher: higher is better (click to flip)
    title_lower: lower is better (click to flip)
    aria_del_col: Delete column
    title_del_col: delete column
    aria_del_row: Delete option {n}
    title_del_row: delete row
    aria_option: Option {n} name
    aria_rating: Rating of {opt} on {crit}
    ref_fallback: "row {i}"
    poles_title: Axis poles
    poles_hint: "Rename the four poles; the map updates live."
    aria_pole_top: Top pole name
    aria_pole_left: Left pole name
    aria_pole_right: Right pole name
    aria_pole_bottom: Bottom pole name
  # Localized labels for the structural parts of the written analysis (the headings
  # and fixed lines around the LLM narrative), so the whole report follows the
  # language. Placeholders: {left} {right} {bottom} {top} {pct} {cols}.
  analysis:
    interpretation: Interpretation
    axes: Axes
    axis_horizontal: "Horizontal ({left} ↔ {right}):"
    axis_vertical: "Vertical ({bottom} ↔ {top}):"
    info_share: "{pct} of the information."
    relevant_columns: "Relevant columns for axis: {cols}."
    preserved: "In two axes, we preserved **{pct}** of the information."
    highlighted: Highlighted approaches
    leader: "Chosen leader reference:"
    opposite: "Exact reference opposite:"
    opposite_note: (diametrically opposite the leader on the map)
    strongest_top: "Strongest toward {top}:"
    top_note: (challenger furthest up the vertical axis)
    strongest_right: "Strongest toward {right}:"
    right_note: (challenger furthest along the horizontal axis)

fr:
  # « Voitures dans le quadrant », jamais « Voitures in the Quadrant ».
  title_template: "{plural} dans le quadrant"
  noun_prompt: |
    Donnez le singulier et le pluriel EXACTEMENT de ce mot, en français, avec une
    majuscule, sans le remplacer par un synonyme : « {word} ».
    Répondez en JSON : {{"singular": "...", "plural": "..."}}.
  glossary_prefix: "Glossaire, traduisez en mots simples, n'affichez jamais l'acronyme : "
  axis_prompt: |
    Vous nommez les quatre pôles d'une carte 2D dont les deux axes sont des
    combinaisons pondérées des critères d'entrée. Chaque critère est noté « plus
    c'est haut, mieux c'est » : une valeur plus élevée signifie toujours plus d'une
    bonne chose.

    Chaque étiquette nomme une QUALITÉ POSITIVE, une force pour laquelle une
    approche de ce côté peut être louée. Donnez une étiquette de UN à TROIS vrais
    mots français. Règles :
    - TOUJOURS une qualité positive. JAMAIS un inconvénient, un coût ni un négatif.
      Exemples interdits : « Coût élevé », « Cher », « Lent », « Complexe ». Si un
      critère est une quantité inverse (coût, prix, latence, erreurs) où une note
      élevée signifie MOINS, nommez plutôt le bénéfice (« Abordable », « Rapide »,
      « Fiable », « Simple », « Sécurisé »).
    - Les quatre étiquettes sont quatre qualités positives DIFFÉRENTES, jamais une
      paire opposée ni des antonymes (pas « Abordable » et « Cher », pas « Rapide »
      et « Lent »), et ne réutilisez jamais un mot d'une étiquette à l'autre.
    - N'affichez jamais d'acronyme ni d'abréviation ; explicitez l'idée.
    - Rédigez les étiquettes en français.

    Chaque pôle ci-dessous liste les critères où les approches obtiennent les
    meilleures notes. Nommez la qualité positive commune de cette liste :
    {glossary}Pôle GAUCHE, les plus fortes en : {left}
    Pôle DROIT, les plus fortes en : {right}
    Pôle BAS, les plus fortes en : {bottom}
    Pôle HAUT, les plus fortes en : {top}

    Répondez en JSON : {{"left": "<label>", "right": "<label>", "bottom": "<label>", "top": "<label>"}}.
  narrative_prompt: |
    Vous êtes un analyste pointu qui rédige les enseignements d'une carte de
    positionnement, en français. Écrivez 4 à 6 phrases d'analyse concrète et utile à
    la décision, PAS une paraphrase des axes. L'axe horizontal va de « {left} » à
    « {right} » ; le vertical de « {bottom} » à « {top} ». « {reference} » est la
    référence en tête (haut à droite). Meilleur={best}, pire={worst} ; le plus
    marquant vers « {top} » est {champ_top}, vers « {right} » est {champ_right}.
    Ordre global, du plus fort au plus faible : {leaderboard}. Traitez, en prose
    fluide : (1) l'enseignement principal à retenir ; (2) ce sur quoi « {reference} »
    l'emporte vraiment et où elle est exposée ; (3) l'arbitrage le plus net du champ
    et quelle option pour quel besoin ; (4) toute option qui surperforme ou
    sous-performe son rang. Nommez de vraies options, soyez précis et vraiment utile,
    jamais générique. Pas d'acronymes, pas de listes à puces. Écrivez une prose sans
    tiret de ponctuation : virgules, deux-points, points-virgules ou phrases séparées
    à la place des cadratins ou demi-cadratins.
  # « Flemme » : l'utilisateur a saisi les noms des options et des critères ; le
  # modèle remplit chaque note depuis sa propre connaissance. {noun} = mot d'en-tête.
  ratings_prompt: |
    Vous notez des options sur des critères pour un tableau comparatif, à partir de
    votre propre connaissance.
    Les options ({noun}) sont : {options}.
    Les critères sont : {criteria}.
    Notez CHAQUE option sur CHAQUE critère avec un ENTIER de 1 à 5, où 5 est le
    meilleur possible et 1 le pire, en jugeant chaque critère sur son sens positif
    simple (pour un critère de coût/prix/latence, 5 = bon marché/rapide, 1 =
    cher/lent). Fondez les notes sur ce pour quoi ces options sont réellement connues.
    Répondez uniquement en JSON, un objet associant chaque nom exact d'option à un
    objet associant chaque nom exact de critère à son entier, p. ex.
    {{"OptionA": {{"Crit1": 4, "Crit2": 2}}, "OptionB": {{"Crit1": 3, "Crit2": 5}}}}.
  gui:
    lang_name: Français
    baseline: Sachez où se situe vraiment chaque option.
    github: ⭐️ sur GitHub
    footer_note: "Tout est local : votre tableau ne quitte jamais cette machine."
    theme_light_aria: Passer au thème sombre
    theme_dark_aria: Passer au thème clair
    lang_aria: Changer de langue
