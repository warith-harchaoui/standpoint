    title_del_row: eliminar la fila
    aria_option: Nombre de la opción {n}
    aria_rating: Nota de {opt} en {crit}
    ref_fallback: "fila {i}"
    poles_title: Polos de los ejes
    poles_hint: "Renombra los cuatro polos; el mapa se actualiza al instante."
    aria_pole_top: Nombre del polo superior
    aria_pole_left: Nombre del polo izquierdo
    aria_pole_right: Nombre del polo derecho
    aria_pole_bottom: Nombre del polo inferior
