es:
  # «Coches en el cuadrante», nunca «Coches in the Quadrant».
  title_template: "{plural} en el cuadrante"
  noun_prompt: |
    Traduce esta palabra al español si no lo está ya, y luego da su singular y
    plural, con mayúscula, no un sinónimo diferente: «{word}».
    Responde en JSON: {{"singular": "...", "plural": "..."}}.
  glossary_prefix: "Glosario, traduce a palabras simples, nunca muestres la sigla: "
  axis_prompt: |
    Estás nombrando los cuatro polos de un mapa 2D cuyos dos ejes son combinaciones
    ponderadas de los criterios de entrada. Cada criterio se valora « cuanto más
    alto, mejor » : un valor más alto siempre significa más de algo bueno.

    Cada etiqueta nombra una CUALIDAD POSITIVA, una fortaleza por la que una
    propuesta de ese extremo puede ser elogiada. Da una etiqueta de UNA a TRES
    palabras reales en español. Reglas:
    - SIEMPRE una cualidad positiva. NUNCA un inconveniente, un coste ni un negativo.
      Ejemplos prohibidos: « Coste alto », « Caro », « Lento », « Complejo ». Si un
      criterio es una cantidad inversa (coste, precio, latencia, errores) donde una
      puntuación alta significa MENOS, nombra el beneficio (« Asequible », « Rápido »,
      « Fiable », « Sencillo », « Seguro »).
    - Las cuatro etiquetas son cuatro cualidades positivas DIFERENTES, nunca un par
      opuesto ni antónimos (no « Asequible » y « Caro », no « Rápido » y « Lento »),
      y nunca reutilices una palabra entre etiquetas.
    - Nunca muestres una sigla ni una abreviatura; explica la idea.
    - Escribe las etiquetas en español.

    Cada polo abajo lista los criterios donde las propuestas puntúan más alto.
    Nombra la cualidad positiva común de esa lista:
    {glossary}Polo IZQUIERDO, más fuertes en: {left}
    Polo DERECHO, más fuertes en: {right}
    Polo INFERIOR, más fuertes en: {bottom}
    Polo SUPERIOR, más fuertes en: {top}

    Responde en JSON: {{"left": "<label>", "right": "<label>", "bottom": "<label>", "top": "<label>"}}.
  # «Flemme»: el usuario escribió los nombres; el modelo rellena cada nota con su
  # propio conocimiento. {noun} es la palabra de la primera columna.
  analysis_md:
    dir_left: "izquierda"
    dir_right: "derecha"
    dir_top: "arriba"
    dir_bottom: "abajo"
    axes_heading: "Ejes"
    analysis_heading: "Análisis"
    imputed_heading: "Celdas que la tabla no contenía"
    horizontal: "Horizontal"
    vertical: "Vertical"
    variance_axis: "~{pct} % de la varianza"
    variance_total: "En dos ejes, hemos preservado ~{pct} % de la información de la tabla."
    imputed_intro: "Estas puntuaciones no se facilitaron y se rellenaron con el mínimo de su columna, de modo que cada coordenada anterior depende en parte de ellas:"
    unavailable: "El análisis escrito necesita el modelo local, que no estaba accesible."
  analysis_prompt: |
    Estás escribiendo el breve análisis escrito que acompaña a un mapa de
    posicionamiento 2D. El mapa es un ACP de una tabla comparativa: cada
    criterio se puntúa de 1 a 5, más alto es mejor, y los dos ejes son
    combinaciones ponderadas de esos criterios.

    Escribe DOS o TRES párrafos breves en español llano. Reglas:
    - Interpreta, no recites. El lector ya tiene la tabla y los números; lo que
      quiere es lo que la forma SIGNIFICA.
    - Nunca indiques un porcentaje, una coordenada ni una puntuación. Se
      calculan y se imprimen alrededor de tu texto, y un número inventado los
      contradiría.
    - Di qué separa el eje horizontal y qué separa el vertical. Nombra los
      criterios que más pesan en cada uno.
    - Nombra qué opciones se agrupan y por qué, incluidas las que caen en la
      misma esquina por razones distintas.
    - Si el líder gana en algunos ejes y no en otros, dilo con claridad. Un
      análisis que sólo halaga al líder no vale nada.
    - Nunca digas que dos opciones coinciden, convergen o comparten una
      esquina si la lista de cuadrantes no les da la MISMA etiqueta. Agrupar
      dos opciones por intuición produce una frase que el mapa contradice.
    - Sin títulos, sin listas, sin negrita. Sólo prosa corrida.
    - Escribe en español.

    Opción de referencia (el líder): {reference}

    Eje horizontal: {axis_1}, de {pole_left} a la izquierda a {pole_right} a la derecha.
    Pesos en el eje horizontal: {loadings_1}
    Hacia {pole_right} (el lado derecho), de mayor a menor: {right_side}
    Hacia {pole_left} (el lado izquierdo), de mayor a menor: {left_side}

    Eje vertical: {axis_2}, de {pole_bottom} abajo a {pole_top} arriba.
    Pesos en el eje vertical: {loadings_2}
    Hacia {pole_top} (la mitad superior), de mayor a menor: {top_side}
    Hacia {pole_bottom} (la mitad inferior), de mayor a menor: {bottom_side}

    El cuadrante de cada opción, ya resuelto para ti: usa estas palabras y no
    intentes volver a deducir una posición: {quadrants}
  ratings_prompt: |
    Valoras opciones sobre criterios para una tabla comparativa, con tu propio
    conocimiento.
    Las opciones ({noun}) son: {options}.
    Los criterios son: {criteria}.
    Valora CADA opción en CADA criterio con un ENTERO de 1 a 5, donde 5 es lo mejor
    posible y 1 lo peor, juzgando cada criterio por su sentido positivo simple (para
    un criterio de coste/precio/latencia, 5 = barato/rápido, 1 = caro/lento). Basa las
    notas en aquello por lo que estas opciones son realmente conocidas.
    Responde solo en JSON, un objeto que asocia cada nombre exacto de opción a un
    objeto que asocia cada nombre exacto de criterio a su entero, p. ej.
    {{"OpcionA": {{"Crit1": 4, "Crit2": 2}}, "OpcionB": {{"Crit1": 3, "Crit2": 5}}}}.
  vlm_assess_prompt: >-
    Esta imagen es un mapa de posicionamiento competitivo en 2D. El único punto
    ROJO es el líder y debería situarse en el CUADRANTE SUPERIOR DERECHO (en
    cualquier lugar del cuarto superior derecho del mapa, por encima del eje
    horizontal y a la derecha del eje vertical; NO necesita tocar la esquina
    extrema). Los cuatro polos del eje están nombrados en cursiva en los bordes
    superior, inferior, izquierdo y derecho. Evalúa tres cosas: (1) ¿está el
    punto rojo del líder en algún lugar del cuadrante superior derecho? (2)
    ¿son legibles las etiquetas de los puntos y no se solapan demasiado? (3)
    ¿están presentes y son legibles las cuatro etiquetas de polo en cursiva en
    los bordes? Responde en JSON.
  # Notas de la verificación de disposición determinista (`assess_layout`),
