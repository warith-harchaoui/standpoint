    hint_toggle: "Basculez ⬇️ / ⬆️ sur une colonne pour indiquer si le score le plus bas ou le plus haut est le meilleur."
    options_title: Options
    reference_label: Référence choisie (coin haut droit)
    transparent_bg: Fond transparent
    generate: Générer le quadrant
    generating: Génération…
    status_running: "Analyse en composantes principales et interrogation du modèle local… (environ 10 à 25 s)"
    flemme_running: "Le modèle remplit le tableau… (cela peut prendre un moment)"
    quadrant_title: Quadrant
