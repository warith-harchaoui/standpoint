    aria_options_col: Nombre de la columna de opciones
    aria_criterion: Nombre del criterio {n}
    aria_higher: Más alto es mejor, clic para invertir
    aria_lower: Más bajo es mejor, clic para invertir
    title_higher: más alto es mejor (clic para invertir)
    title_lower: más bajo es mejor (clic para invertir)
    aria_del_col: Eliminar la columna
