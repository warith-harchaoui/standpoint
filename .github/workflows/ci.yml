name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deliberately light (coding standard, Rule 18: shift expensive validation left).
# CI is the reproducible final gate — one Python, lint + the deterministic core tests.
# The heavier checks run locally before pushing (see CONTRIBUTING.md "Running the
# checks locally"): the full ruff pass over skills/, the GUI + MCP endpoint tests
# (the [gui]/[mcp] extras), the Playwright end-to-end test, and the DeepEval eval —
# all of which self-skip here anyway when their extras/models aren't present.
jobs:
  ci:
    name: lint + core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Pin ruff so the lint result is reproducible across ruff releases.
          pip install "ruff==0.15.21"
      - name: Lint (Python only; formatting is enforced locally)
        run: ruff check standpoint tests
      - name: Core tests
        # The GUI / MCP / e2e / eval tests skip themselves without their extras and
        # without a local Ollama, so this is the deterministic core suite.
        run: pytest -q
