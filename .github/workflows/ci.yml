name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deliberately light (coding standard, Rule 18: shift expensive validation left).
# CI is the reproducible final gate: one Python, lint + the deterministic tests that
# need no local model. The `gui` extra is pure-Python (FastAPI + httpx TestClient, no
# Chromium, no Ollama), so the model-free GUI/API tests (endpoints, i18n integrity,
# auto-fill validation, the 503 error paths) run here and a failure blocks the merge.
# The genuinely heavy checks still self-skip here and run locally before pushing (see
# CONTRIBUTING.md): the Playwright end-to-end test, the MCP tools ([mcp] extra), the
# DeepEval eval, and every @needs_model test (skipped when no Ollama is reachable).
jobs:
  ci:
    name: lint + core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev and gui extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
          # Pin ruff so the lint result is reproducible across ruff releases.
          pip install "ruff==0.15.21"
      - name: Lint (Python only; formatting is enforced locally)
        # Same four paths as scripts/check.sh, so a lint error can never pass here
        # and fail the local gate. `ruff check` is static -- linting the skill
        # scripts and the static-build sources needs none of their dependencies
        # installed, so the extra coverage costs no runner time.
        run: ruff check standpoint tests skills webapp
      - name: Tests (model-free; failures block the merge)
        # `CI` is set by GitHub Actions; the conftest guard skips @needs_model tests
        # when Ollama is unreachable, keeping this the deterministic, model-free gate.
        run: pytest -q -m "not needs_model"

  floor:
    name: Floor (py3.10 installs and imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python = ">=3.10"` is a promise to anyone running `pip install`:
    # on 3.10 this package installs and imports. Nothing in the suite checked
    # it -- sixteen members made the promise and only speaker-helper ran the
    # version, so the rest was a claim with no evidence behind it. Verified by
    # hand across all seventeen before this job was added, so it starts green.
    #
    # Install and import, deliberately not the test suite. The tests use 3.11
    # features legitimately (`tomllib`, behind a `tomli` fallback), and gating
    # the floor on dev-only concerns would fail this job for reasons that have
    # nothing to do with the promise. No member carries torch in its base
    # dependencies, so this is a cached-wheel install: well under a minute,
    # which is the point.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import standpoint"
